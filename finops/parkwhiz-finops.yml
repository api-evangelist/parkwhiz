meters:
- name: bookings
  description: Parking reservations created via the API, each carrying a parking price plus any service fee.
  unit: bookings
  aggregation: sum
  dimensions:
  - partner
  - location
  - account
- name: booking_value
  description: Gross parking spend settled through bookings (base price plus fees).
  unit: currency
  aggregation: sum
  dimensions:
  - partner
  - location
- name: cancellations
  description: Cancelled bookings that may trigger refunds/adjustments.
  unit: bookings
  aggregation: sum
  dimensions:
  - partner
  - account
- name: partner_revenue_share
  description: Negotiated revenue share / referral earnings paid to a partner on bookings.
  unit: currency
  aggregation: sum
  dimensions:
  - partner
principles:
- name: Visibility
  description: Track booking volume, gross booking value, and cancellations per partner and location.
- name: Allocation
  description: Attribute bookings to the originating partner, integration, and location so parking spend maps to cost centers.
- name: Optimization
  description: Use quote previews and booking previews to confirm price before committing; reduce cancellation-driven adjustments; negotiate revenue-share terms against booking volume.
- name: Accountability
  description: Assign an owner per partner integration and review monthly booking value and revenue share against agreement terms.
