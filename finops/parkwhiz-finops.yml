description: >-
  FinOps view of ParkWhiz API economics. Unlike a metered SaaS API, ParkWhiz is
  a parking reservation marketplace, so there is no per-request invoice to model.
  Cost and revenue flow through the booking transactions made via the v4 API:
  each reservation carries a parking price (set per location) plus any service /
  booking fee, and partner economics are governed by negotiated revenue-share or
  referral terms. For an integrating partner, the relevant "spend" is the cost of
  parking booked on behalf of users and the net of any revenue share, not an API
  usage bill.
notes: >-
  No public API price list or usage invoice exists to reconcile against FOCUS
  line items. Per-partner fee splits and revenue share are private. Track booking
  volume and settled parking spend as the primary cost/revenue drivers.
