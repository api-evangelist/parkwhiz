name: ParkWhiz
kind: company
description: ParkWhiz is a parking reservation and mobility platform (with the
  BestParking discovery brand) that lets drivers search, price, reserve, and pay
  for parking at facilities, venues, and events across North America. Its consumer
  apps and website are backed by a documented v4 REST API (api.parkwhiz.com /
  api.arrive.com) covering location and quote search, bookings, parking passes,
  venues and events, monthly parking, vehicles, payment methods, and accounts.
  ParkWhiz was rebranded to Arrive / Arrive Mobility and merged into FlashParking
  (Flash) in January 2021; separately, EasyPark Group acquired the rights to the
  "Arrive" name from Flash and rebranded itself to Arrive in 2025. The v4 API is
  publicly documented but partner-gated - OAuth client credentials are issued to
  approved partners on request (dev@parkwhiz.com), not self-serve.
