actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on the ParkWhiz API - the documented
    public surface is the v4 REST API over HTTPS. No AsyncAPI document was
    created because there is no server-push transport to model. The apis.yml
    catalogs the REST v4 API grouped into logical APIs (Quotes & Locations,
    Bookings, Monthly Parking, Venues & Events, Accounts & Vehicles, Tickets).
